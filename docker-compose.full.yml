version: '3.8'

# Full-stack Docker Compose configuration
# This runs the entire application (frontend + backend) in containers
# Data is stored in a JSON file (persisted in a Docker volume)

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipboard-backend
    restart: unless-stopped
    environment:
      STORAGE_TYPE: json
      DATA_DIR: /app/data
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "3001:3001"
    volumes:
      - clipboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - clipboard-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:3001/api"
    container_name: clipboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - clipboard-network

volumes:
  clipboard-data:
    driver: local

networks:
  clipboard-network:
    driver: bridge
