version: '3.8'

# Full-stack Docker Compose configuration
# This runs the entire application (frontend, backend, database) in containers

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: clipboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipboarduser
      POSTGRES_PASSWORD: clipboardpass
      POSTGRES_DB: clipboard_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboarduser -d clipboard_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipboard-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://clipboarduser:clipboardpass@postgres:5432/clipboard_manager?schema=public"
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - clipboard-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:3001/api"
    container_name: clipboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - clipboard-network

volumes:
  postgres-data:
    driver: local

networks:
  clipboard-network:
    driver: bridge
