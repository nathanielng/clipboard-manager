version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipboard-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipboarduser
      POSTGRES_PASSWORD: clipboardpass
      POSTGRES_DB: clipboard_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboarduser -d clipboard_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
